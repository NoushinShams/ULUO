<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ULUO — App (Quiz + Email + Loading + Plan)</title>
  <style>
    :root{
      --bg: #F6F2FF;
      --card: rgba(255,255,255,0.92);
      --ink: #14131A;
      --muted:#6E6A7A;
      --stroke: rgba(20,19,26,0.10);

      --violet:#7C5CFF;
      --violet2:#B9A6FF;

      --radius: 26px;
      --radius2: 18px;
      --shadow: 0 18px 50px rgba(20,19,26,0.10);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--ink);
      background:
        radial-gradient(900px 450px at 20% 0%, rgba(124,92,255,0.18), transparent 55%),
        radial-gradient(900px 450px at 85% 10%, rgba(185,166,255,0.14), transparent 55%),
        radial-gradient(900px 450px at 50% 100%, rgba(124,92,255,0.12), transparent 55%),
        var(--bg);
      min-height:100vh;
    }

    /* App shell (mobile-first) */
    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 16px 40px;
      display:grid;
      gap: 14px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 6px 2px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      user-select:none;
    }

    .logo-slot{
      width:42px; height:42px;
      border-radius: 14px;
      background: rgba(255,255,255,0.65);
      border: 1px dashed rgba(20,19,26,0.22);
      display:grid;
      place-items:center;
      color: rgba(20,19,26,0.45);
      font-size:11px;
      line-height:1.05;
      text-align:center;
      padding:4px;
    }

    .brand h1{
      font-size:14px; margin:0;
      letter-spacing:0.08em;
      font-weight: 780;
    }
    .brand small{
      display:block;
      color:var(--muted);
      font-weight: 560;
      letter-spacing: 0.02em;
      margin-top:2px;
      font-size:12px;
    }

    .pill{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border: 1px solid rgba(20,19,26,0.08);
      background: rgba(255,255,255,0.55);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      min-width: 160px;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: var(--violet);
      box-shadow: 0 0 0 6px rgba(124,92,255,0.12);
    }
    .pill b{font-size:12px}
    .pill span{font-size:12px; color:var(--muted)}

    .card{
      background: var(--card);
      border: 1px solid rgba(20,19,26,0.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(12px);
    }

    .hero{
      padding: 18px 16px;
      display:grid;
      gap: 10px;
    }

    .hero h2{
      margin:0;
      font-size: 26px;
      letter-spacing:-0.02em;
      line-height: 1.05;
    }
    .hero p{
      margin:0;
      color:var(--muted);
      font-size: 14px;
      line-height: 1.45;
      max-width: 62ch;
    }

    .progress{
      height: 12px;
      background: rgba(20,19,26,0.06);
      border-radius: 999px;
      overflow:hidden;
      border: 1px solid rgba(20,19,26,0.05);
    }
    .progress > div{
      height:100%;
      width:0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--violet), rgba(185,166,255,0.95));
      transition: width 240ms ease;
    }

    .content{
      padding: 14px 16px 16px;
      display:grid;
      gap: 12px;
      min-height: 260px;
    }

    .actions{
      display:flex;
      gap: 10px;
      justify-content:space-between;
      align-items:center;
      padding: 14px 16px 16px;
      border-top: 1px solid rgba(20,19,26,0.08);
      background: rgba(255,255,255,0.55);
    }

    .hint{
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      max-width: 52ch;
    }

    .btnrow{display:flex; gap:10px; align-items:center;}
    .btn{
      border: 1px solid rgba(20,19,26,0.10);
      background: rgba(255,255,255,0.70);
      border-radius: 16px;
      padding: 12px 14px;
      font-weight: 700;
      cursor:pointer;
      font-size: 14px;
      min-width: 120px;
      transition: transform 90ms ease, background 120ms ease, opacity 120ms ease;
    }
    .btn:active{ transform: scale(0.99); }
    .btn.primary{
      border-color: rgba(124,92,255,0.65);
      background: linear-gradient(135deg, rgba(124,92,255,0.95), rgba(185,166,255,0.95));
      color: white;
    }
    .btn.ghost{
      background: transparent;
      border-color: rgba(20,19,26,0.12);
      color: var(--muted);
      min-width: 110px;
    }
    .btn[disabled]{opacity:0.55; cursor:not-allowed;}

    /* Blocks */
    .grid{display:grid; gap: 12px;}
    .mini{
      border-radius: 20px;
      border: 1px solid rgba(20,19,26,0.10);
      background: rgba(255,255,255,0.70);
      padding: 14px;
    }
    .mini h4{ margin:0; font-size: 14px; }
    .mini p{ margin:8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .mini ul{ margin: 10px 0 0; padding-left: 18px; color: var(--muted); }
    .mini li{ margin: 6px 0; }

    /* Quiz UI */
    .qhead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }
    .qtitle{
      margin:0;
      font-size: 16px;
      letter-spacing:-0.01em;
      color: var(--muted);
    }
    .qmeta{
      color: var(--muted);
      font-size: 12px;
      padding-top: 2px;
      white-space:nowrap;
    }

    .chips{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .chip{
      border: 1px solid rgba(20,19,26,0.10);
      background: rgba(255,255,255,0.65);
      border-radius: 18px;
      padding: 12px;
      cursor:pointer;
      transition: transform 90ms ease, border-color 120ms ease, background 120ms ease;
      min-height: 56px;
      display:flex;
      align-items:center;
      gap: 10px;
      text-align:left;
    }
    .chip:hover{ transform: translateY(-1px); }
    .chip:active{ transform: translateY(0px) scale(0.99); }
    .chip .icon{
      width: 34px; height: 34px;
      border-radius: 14px;
      display:grid; place-items:center;
      border: 1px solid rgba(20,19,26,0.08);
      background: rgba(124,92,255,0.10);
      font-size: 14px;
      flex: 0 0 auto;
    }
    .chip .text b{ display:block; font-size: 13px; }
    .chip .text small{ display:block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .chip.selected{
      border-color: rgba(124,92,255,0.55);
      background: rgba(124,92,255,0.10);
    }

    /* Email */
    .field{display:grid; gap: 6px;}
    label{ font-size: 12px; color: var(--muted); }
    input{
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(20,19,26,0.14);
      background: rgba(255,255,255,0.75);
      font-size: 14px;
      outline:none;
    }
    input:focus{
      border-color: rgba(124,92,255,0.55);
      box-shadow: 0 0 0 4px rgba(124,92,255,0.14);
    }
    .error{
      display:none;
      margin-top:10px;
      color: rgba(220,70,70,0.95);
      font-weight:700;
      font-size:12px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(20,19,26,0.10);
      background: rgba(124,92,255,0.10);
      font-size: 12px;
      font-weight: 800;
      width: fit-content;
    }

    /* Loading (app-like) */
    .loadingWrap{
      display:grid;
      place-items:center;
      gap: 14px;
      padding: 18px 6px;
      text-align:center;
    }
    .spinner{
      width: 86px;
      height: 86px;
      border-radius: 999px;
      background:
        conic-gradient(from 0deg, rgba(124,92,255,1), rgba(185,166,255,0.18));
      -webkit-mask: radial-gradient(circle, transparent 55%, #000 56%);
      mask: radial-gradient(circle, transparent 55%, #000 56%);
      animation: spin 1.1s linear infinite;
      box-shadow: 0 18px 50px rgba(124,92,255,0.18);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .steps{
      display:grid;
      gap: 8px;
      width: min(520px, 100%);
    }
    .step{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding: 12px 12px;
      border-radius: 18px;
      border: 1px solid rgba(20,19,26,0.10);
      background: rgba(255,255,255,0.65);
      font-size: 13px;
      color: var(--muted);
    }
    .step b{ color: var(--ink); }
    .pulse{
      width: 10px; height: 10px; border-radius:999px;
      background: rgba(124,92,255,0.40);
      box-shadow: 0 0 0 0 rgba(124,92,255,0.22);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse{
      0%{ box-shadow: 0 0 0 0 rgba(124,92,255,0.22); }
      60%{ box-shadow: 0 0 0 10px rgba(124,92,255,0.0); }
      100%{ box-shadow: 0 0 0 0 rgba(124,92,255,0.0); }
    }

    /* Desktop enhancement later */
    @media (min-width: 860px){
      .wrap{ padding: 24px 22px 60px; gap: 16px; }
      .hero{ padding: 22px 22px; }
      .content{ padding: 16px 22px 18px; min-height: 300px; }
      .actions{ padding: 14px 22px 18px; }
      .chips{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand" role="banner">
        <div class="logo-slot">LOGO<br/>ICI</div>
        <div>
          <h1>ULUO</h1>
          <small id="subTitle">App prototype (mobile-first)</small>
        </div>
      </div>

      <div class="pill" aria-label="statut">
        <span class="dot"></span>
        <div>
          <b id="pillTitle">Splash</b>
          <span id="pillSub">…</span>
        </div>
      </div>
    </div>

    <div class="card" id="appCard">
      <div class="hero">
        <h2 id="heroTitle">ULUO</h2>
        <p id="heroDesc">Calme, focus, sommeil. Pas de jugement.</p>
        <div class="progress" aria-label="progression">
          <div id="progressBar"></div>
        </div>
      </div>

      <div class="content" id="view"></div>

      <div class="actions">
        <div class="hint" id="hint">Prototype app: flow complet (questions → email → loading → plan).</div>
        <div class="btnrow">
          <button class="btn ghost" id="backBtn" type="button">Retour</button>
          <button class="btn primary" id="nextBtn" type="button">Continuer</button>
        </div>
      </div>
    </div>
  </div>

<script>
  // --------------------------
  // ROUTES (app screens)
  // --------------------------
  const routes = {
    splash: '#/splash',
    home:   '#/home',
    quiz:   '#/quiz',
    email:  '#/email',
    loading:'#/loading',
    result: '#/result',
  };

  // UX: demander email après 3 questions (bon timing)
  const EMAIL_AFTER_QUESTIONS = 3;

  // Questions (claires, une idée par écran)
  const questions = [
    {
      id: "goal",
      title: "Pourquoi tu veux utiliser ULUO ?",
      subtitle: "Pour adapter ton plan.",
      multi: false,
      options: [
        { key:"sleep", label:"Dormir mieux", hint:"Surtout le soir", icon:"🌙" },
        { key:"scroll_less", label:"Moins scroller", hint:"Réduire l’automatique", icon:"⏳" },
        { key:"focus", label:"Mieux me concentrer", hint:"Sans lutte", icon:"🎯" },
        { key:"calm", label:"Me sentir plus calme", hint:"Moins de surcharge", icon:"🫧" },
        { key:"test", label:"Juste tester", hint:"Sans pression", icon:"✨" }
      ]
    },
    {
      id: "risk_window",
      title: "C’est surtout quand que tu scrolles trop ?",
      subtitle: "On cible une fenêtre précise.",
      multi: false,
      options: [
        { key:"bed", label:"Avant de dormir", hint:"Le scroll-infini", icon:"🛏️" },
        { key:"wake", label:"Au réveil", hint:"Je me perds vite", icon:"☀️" },
        { key:"transport", label:"Dans les transports", hint:"Par réflexe", icon:"🚇" },
        { key:"breaks", label:"Pendant les pauses", hint:"“juste 2 min”", icon:"☕" },
        { key:"stress", label:"Quand je suis stressé(e)", hint:"Pour fuir", icon:"⚡" },
        { key:"bored", label:"Quand je m’ennuie", hint:"Pour remplir", icon:"🪑" }
      ]
    },
    {
      id: "apps",
      title: "Quelles apps te font perdre le plus de temps ?",
      subtitle: "Choisis max 3. On ne bloque pas tout, on bloque utile.",
      multi: true,
      limit: 3,
      options: [
        { key:"ig", label:"Instagram", hint:"Scroll + stories", icon:"📷" },
        { key:"tt", label:"TikTok", hint:"Boucle infinie", icon:"🎞️" },
        { key:"yt", label:"YouTube", hint:"Shorts + vidéos", icon:"▶️" },
        { key:"x", label:"X / Twitter", hint:"News + threads", icon:"📰" },
        { key:"snap", label:"Snapchat", hint:"Streaks", icon:"👻" },
        { key:"other", label:"Autre", hint:"Je sais lequel", icon:"➕" }
      ]
    },
    {
      id: "energy",
      title: "En ce moment, ton énergie est…",
      subtitle: "Ça ajuste l’intensité du plan.",
      multi: false,
      options: [
        { key:"low", label:"Basse", hint:"Je suis drainé(e)", icon:"🫠" },
        { key:"mid", label:"Moyenne", hint:"Ça va", icon:"🙂" },
        { key:"good", label:"Bonne", hint:"Je peux avancer", icon:"💪" },
        { key:"var", label:"Variable", hint:"Ça dépend", icon:"🌦️" }
      ]
    },
    {
      id: "minutes",
      title: "Objectif réaliste par jour ?",
      subtitle: "Réaliste = tu continues.",
      multi: false,
      options: [
        { key:"5", label:"5 min", hint:"Mini pause", icon:"5" },
        { key:"10", label:"10 min", hint:"Petit reset", icon:"10" },
        { key:"15", label:"15 min", hint:"Bon départ", icon:"15" },
        { key:"20", label:"20 min", hint:"Ambitieux", icon:"20" },
        { key:"unsure", label:"Je ne sais pas", hint:"On propose", icon:"?" }
      ]
    },
    {
      id: "replacement",
      title: "Quand tu veux décrocher, tu préfères…",
      subtitle: "Une micro-action à la place du scroll.",
      multi: false,
      options: [
        { key:"breathe", label:"Respirer 60s", hint:"Rapide et doux", icon:"🫁" },
        { key:"walk", label:"Marcher 5 min", hint:"Corps = reset", icon:"🚶‍♀️" },
        { key:"song", label:"1 chanson", hint:"3 minutes max", icon:"🎧" },
        { key:"stretch", label:"Étirements 2 min", hint:"Débloquer le corps", icon:"🧘" },
        { key:"write", label:"Écrire 3 lignes", hint:"Décharge mentale", icon:"✍️" },
        { key:"tidy", label:"Ranger 1 chose", hint:"Micro-victoire", icon:"🧺" }
      ]
    },
    {
      id: "tone",
      title: "Tu veux ULUO plutôt…",
      subtitle: "Le ton change tout (sinon désinstallation).",
      multi: false,
      options: [
        { key:"soft", label:"Très doux", hint:"Soutien", icon:"🤍" },
        { key:"neutral", label:"Neutre", hint:"Simple", icon:"⚪" },
        { key:"firm", label:"Un peu ferme", hint:"Cadre", icon:"🧱" }
      ]
    }
  ];

  // --------------------------
  // STATE
  // --------------------------
  const state = {
    qIndex: 0,
    answers: {},         // {qid: [keys]}
    email: "",
    firstName: "",
    askedEmailOnce: false,
    loadingStarted: false
  };

  // Elements
  const view = document.getElementById('view');
  const progressBar = document.getElementById('progressBar');
  const heroTitle = document.getElementById('heroTitle');
  const heroDesc  = document.getElementById('heroDesc');
  const hint = document.getElementById('hint');
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pillTitle = document.getElementById('pillTitle');
  const pillSub = document.getElementById('pillSub');
  const subTitle = document.getElementById('subTitle');

  function setHash(route){ window.location.hash = route; }
  function getHash(){ return window.location.hash || routes.splash; }

  function getAnswer(id){ return state.answers[id] || []; }

  function validateEmail(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  }

  function setProgress(){
    const h = getHash();
    if(h === routes.splash || h === routes.home){
      progressBar.style.width = "0%";
      return;
    }
    if(h === routes.loading){
      // keep at 98% to create anticipation
      progressBar.style.width = "98%";
      return;
    }
    if(h === routes.result){
      progressBar.style.width = "100%";
      return;
    }
    // quiz/email screens
    const pct = Math.round((state.qIndex / questions.length) * 100);
    progressBar.style.width = pct + "%";
  }

  function toggleOption(q, key){
    const current = new Set(getAnswer(q.id));
    if(q.multi){
      const limit = q.limit || 999;
      if(current.has(key)){
        current.delete(key);
      } else {
        if(current.size >= limit) return; // enforce max
        current.add(key);
      }
    } else {
      current.clear();
      current.add(key);
    }
    state.answers[q.id] = Array.from(current);
  }

  function answeredCount(){
    return Object.keys(state.answers).length;
  }

  function shouldAskEmailNow(){
    if(state.askedEmailOnce) return false;
    if(state.email) return false;
    return answeredCount() >= EMAIL_AFTER_QUESTIONS;
  }

  // --------------------------
  // RENDER SCREENS
  // --------------------------
  function renderSplash(){
    pillTitle.textContent = "Splash";
    pillSub.textContent = "…";
    subTitle.textContent = "App prototype (mobile-first)";
    heroTitle.textContent = "ULUO";
    heroDesc.textContent = "Calme, focus, sommeil. Pas de jugement.";
    hint.textContent = "Écran splash. Tu mets ton logo ici.";

    backBtn.disabled = true;
    nextBtn.textContent = "Entrer";

    view.innerHTML = `
      <div class="loadingWrap">
        <div style="display:grid; gap:10px; place-items:center;">
          <div class="logo-slot" style="width:70px;height:70px;border-radius:22px;font-size:12px;">LOGO<br>ICI</div>
          <div style="font-weight:800;letter-spacing:0.10em;">ULUO</div>
          <div style="color:var(--muted);font-size:12px;max-width:46ch;">
            Un mini-plan 7 jours pour réduire le scroll dans tes moments à risque.
          </div>
        </div>
      </div>
    `;
    setProgress();
  }

  function renderHome(){
    pillTitle.textContent = "Home";
    pillSub.textContent = "Start";
    subTitle.textContent = "Plan personnalisé (2 min)";
    heroTitle.textContent = "Ton plan en 2 minutes.";
    heroDesc.textContent  = "Réponds à quelques questions. ULUO te propose un plan simple et faisable.";
    hint.textContent = "Pas de gamification. Pas de culpabilisation. Juste du calme.";

    backBtn.disabled = false;
    nextBtn.textContent = "Commencer";

    view.innerHTML = `
      <div class="grid">
        <div class="mini">
          <h4>Ce que tu obtiens</h4>
          <ul>
            <li>Une fenêtre à risque ciblée</li>
            <li>Un objectif réaliste (5–20 min)</li>
            <li>Une micro-action de remplacement</li>
            <li>Un plan 7 jours (simple)</li>
          </ul>
        </div>
        <div class="mini">
          <h4>Promesse</h4>
          <p>ULUO n’essaie pas de te “réparer”. Il te donne juste une friction douce au bon moment.</p>
        </div>
      </div>
    `;
    setProgress();
  }

  function renderQuiz(){
    const q = questions[state.qIndex];

    pillTitle.textContent = "Quiz";
    pillSub.textContent = `Q${state.qIndex + 1}/${questions.length}`;
    subTitle.textContent = "Réponds simplement";
    heroTitle.textContent = q.title;
    heroDesc.textContent  = q.subtitle;

    const selected = new Set(getAnswer(q.id));
    const limitTxt = q.multi && q.limit ? ` (max ${q.limit})` : "";

    view.innerHTML = `
      <div class="qhead">
        <p class="qtitle">${q.multi ? "Choix multiple" + limitTxt : "Choix unique"}</p>
        <div class="qmeta">${q.multi ? "1+ choix" : "1 choix"}</div>
      </div>

      <div class="chips">
        ${q.options.map(opt => `
          <button class="chip ${selected.has(opt.key) ? "selected" : ""}" type="button" data-key="${opt.key}">
            <div class="icon">${opt.icon}</div>
            <div class="text">
              <b>${opt.label}</b>
              <small>${opt.hint}</small>
            </div>
          </button>
        `).join("")}
      </div>

      ${q.multi && q.limit ? `<div style="color:var(--muted);font-size:12px;">Sélection: ${selected.size}/${q.limit}</div>` : ``}
    `;

    view.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        toggleOption(q, btn.dataset.key);
        renderQuiz();
      });
    });

    backBtn.disabled = (state.qIndex === 0);
    nextBtn.textContent = (state.qIndex === questions.length - 1) ? "Créer mon plan" : "Continuer";

    const ok = getAnswer(q.id).length > 0;
    hint.textContent = ok
      ? (q.multi ? "Tu peux choisir plusieurs options." : "Choisis une option.")
      : "Choisis au moins une option pour continuer.";

    setProgress();
  }

  function renderEmail(){
    pillTitle.textContent = "Email";
    pillSub.textContent = "Option";
    subTitle.textContent = "Recevoir ton plan";
    heroTitle.textContent = "Où on t’envoie ton plan ?";
    heroDesc.textContent  = "Tu peux continuer sans email, mais il sera nécessaire pour “envoyer” ton plan.";
    hint.textContent = "Oui, c’est un formulaire. Non, ce n’est pas un piège.";

    backBtn.disabled = false;
    nextBtn.textContent = "Valider";

    view.innerHTML = `
      <div class="grid">
        <div class="mini">
          <div class="badge">💌 Récupère ton plan en 1 clic</div>
          <p style="margin-top:10px;">
            Tu as déjà répondu à <b>${answeredCount()}</b> questions. Bon timing: tu es dedans, sans être fatigué(e).
          </p>
        </div>

        <div class="mini">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="toi@exemple.com" autocomplete="email" value="${state.email || ""}">
          </div>
          <div style="height:10px"></div>
          <div class="field">
            <label for="firstName">Prénom (optionnel)</label>
            <input id="firstName" type="text" placeholder="Noushin" autocomplete="given-name" value="${state.firstName || ""}">
          </div>

          <div class="error" id="emailError">Email invalide. Essaie encore (oui, c’est pénible).</div>

          <p style="margin:10px 0 0; color: var(--muted); font-size:12px; line-height:1.45;">
            Tu peux aussi <button id="skipEmail" class="btn ghost" style="padding:6px 10px; min-width:auto; display:inline-block;">continuer sans email</button>
            et le mettre à la fin.
          </p>
        </div>
      </div>
    `;

    document.getElementById('skipEmail').addEventListener('click', () => {
      state.askedEmailOnce = true;
      setHash(routes.quiz);
      render();
    });

    setProgress();
  }

  function renderLoading(){
    pillTitle.textContent = "ULUO";
    pillSub.textContent = "Loading";
    subTitle.textContent = "Génération du plan";
    heroTitle.textContent = "On prépare ton plan…";
    heroDesc.textContent  = "Petite seconde. On assemble tes réponses en plan clair.";
    hint.textContent = "Loading utile: rassure l’utilisateur et rend le résultat plus “valeur”.";

    backBtn.disabled = true;
    nextBtn.textContent = "…";
    nextBtn.disabled = true;

    view.innerHTML = `
      <div class="loadingWrap">
        <div class="spinner" aria-label="Chargement"></div>
        <div style="display:grid; gap:6px;">
          <div style="font-weight:800;">Génération en cours</div>
          <div style="color:var(--muted);font-size:12px;">Analyse · Ciblage · Plan 7 jours</div>
        </div>

        <div class="steps" id="loadSteps">
          <div class="step"><b>Analyse des réponses</b><span class="pulse"></span></div>
          <div class="step"><b>Choix de la fenêtre à risque</b><span class="pulse"></span></div>
          <div class="step"><b>Construction du plan 7 jours</b><span class="pulse"></span></div>
        </div>
      </div>
    `;

    setProgress();

    // simulate app computation then go result
    if(!state.loadingStarted){
      state.loadingStarted = true;

      // subtle step progression (optional)
      const steps = Array.from(document.querySelectorAll('#loadSteps .step'));
      let i = 0;
      const interval = setInterval(() => {
        steps.forEach((s, idx) => {
          s.style.opacity = idx <= i ? "1" : "0.55";
        });
        i++;
        if(i >= steps.length){
          clearInterval(interval);
        }
      }, 650);

      setTimeout(() => {
        setHash(routes.result);
        render();
      }, 2200);
    }
  }

  function buildPlan(){
    const a = (id) => getAnswer(id);

    const goal = a("goal")[0] || "test";
    const windowKey = a("risk_window")[0] || "bed";
    const apps = a("apps").slice(0,3);
    const energy = a("energy")[0] || "mid";
    const mins = a("minutes")[0] || "10";
    const replacement = a("replacement")[0] || "breathe";
    const tone = a("tone")[0] || "neutral";

    const goalMap = {
      sleep: "Dormir mieux",
      scroll_less: "Scroller moins",
      focus: "Mieux me concentrer",
      calm: "Me sentir plus calme",
      test: "Tester"
    };

    const windowMap = {
      bed: "Avant de dormir",
      wake: "Au réveil",
      transport: "Transports",
      breaks: "Pendant les pauses",
      stress: "Quand tu es stressé(e)",
      bored: "Quand tu t’ennuies"
    };

    const appMap = { ig:"Instagram", tt:"TikTok", yt:"YouTube", x:"X / Twitter", snap:"Snapchat", other:"Autre" };
    const energyMap = { low:"Basse", mid:"Moyenne", good:"Bonne", var:"Variable" };
    const toneMap = { soft:"Très doux", neutral:"Neutre", firm:"Un peu ferme" };

    const replMap = {
      breathe: "Respirer 60s",
      walk: "Marcher 5 min",
      song: "Écouter 1 chanson",
      stretch: "Étirements 2 min",
      write: "Écrire 3 lignes",
      tidy: "Ranger 1 chose"
    };

    const minutes = (mins === "unsure") ? 10 : parseInt(mins, 10);
    const targetApps = (apps.length ? apps : ["ig"]).map(x => appMap[x] || x);

    // small “DA” logic: adapt intensity based on energy + tone
    const intensity =
      tone === "soft" ? "doux" :
      tone === "firm" ? "cadre" :
      (energy === "good" ? "cadre" : "doux");

    const week = [
      `Jours 1–2: ${windowMap[windowKey]} → pause ${minutes} min (mode ${intensity})`,
      `Jours 3–4: micro-action "${replMap[replacement]}" avant ${targetApps.join(", ")}`,
      `Jours 5–7: +5 min si facile, sinon stable (pas de punition)`
    ];

    return {
      goal: goalMap[goal] || goal,
      window: windowMap[windowKey] || windowKey,
      apps: targetApps,
      energy: energyMap[energy] || energy,
      minutes,
      replacement: replMap[replacement] || replacement,
      tone: toneMap[tone] || tone,
      week
    };
  }

  function renderResult(){
    pillTitle.textContent = "Plan";
    pillSub.textContent = "Prêt";
    subTitle.textContent = "Plan 7 jours (ULUO)";
    heroTitle.textContent = "Ton plan est prêt.";
    heroDesc.textContent  = "Simple. Réaliste. Faisable.";
    setProgress();

    backBtn.disabled = false;
    nextBtn.disabled = false;

    const plan = buildPlan();

    // UX: CTA depends on email presence
    const hasEmail = !!state.email;
    nextBtn.textContent = hasEmail ? "Envoyer le plan" : "Ajouter email";
    hint.textContent = hasEmail
      ? `Email enregistré: ${state.email}. (démo: on simule l’envoi)`
      : "Pour recevoir le plan par email, il faut un email. Tragique mais vrai.";

    view.innerHTML = `
      <div class="grid">
        <div class="mini">
          <div class="badge">🎯 Objectif: ${plan.goal}</div>
          <p style="margin-top:10px;">
            Fenêtre cible: <b>${plan.window}</b><br>
            Énergie: <b>${plan.energy}</b> · Ton: <b>${plan.tone}</b>
          </p>
        </div>

        <div class="grid2">
          <div class="mini">
            <h4>Apps ciblées</h4>
            <ul>${plan.apps.map(x => `<li>${x}</li>`).join("")}</ul>
          </div>
          <div class="mini">
            <h4>Micro-action</h4>
            <ul>
              <li>${plan.replacement}</li>
              <li>Durée: 60–90 secondes</li>
            </ul>
          </div>
        </div>

        <div class="mini">
          <h4>Plan 7 jours</h4>
          <ul>${plan.week.map(x => `<li>${x}</li>`).join("")}</ul>
        </div>

        <div class="mini">
          <h4>Réception</h4>
          <p>${hasEmail ? `✅ Email: <b>${state.email}</b>` : `Tu n’as pas encore mis ton email.`}</p>
        </div>
      </div>
    `;
  }

  // --------------------------
  // ROUTER
  // --------------------------
  function render(){
    const h = getHash();

    // reset button disabled state (loading overrides)
    nextBtn.disabled = false;

    if(h === routes.splash) return renderSplash();
    if(h === routes.home)   return renderHome();
    if(h === routes.quiz)   return renderQuiz();
    if(h === routes.email)  return renderEmail();
    if(h === routes.loading)return renderLoading();
    if(h === routes.result) return renderResult();

    setHash(routes.splash);
  }

  // --------------------------
  // NAV ACTIONS
  // --------------------------
  nextBtn.addEventListener('click', () => {
    const h = getHash();

    if(h === routes.splash){
      setHash(routes.home);
      return;
    }

    if(h === routes.home){
      state.qIndex = 0;
      setHash(routes.quiz);
      return;
    }

    if(h === routes.quiz){
      const q = questions[state.qIndex];
      if(getAnswer(q.id).length === 0){
        hint.textContent = "Choisis au moins une option pour continuer.";
        return;
      }

      // move forward
      if(state.qIndex < questions.length - 1){
        state.qIndex += 1;

        // Email gate after Q3 answered
        if(shouldAskEmailNow()){
          state.askedEmailOnce = true;
          setHash(routes.email);
          return;
        }

        render();
        return;
      }

      // last question answered -> go loading -> result
      state.loadingStarted = false;
      setHash(routes.loading);
      return;
    }

    if(h === routes.email){
      const email = document.getElementById('email').value.trim();
      const firstName = document.getElementById('firstName').value.trim();
      const err = document.getElementById('emailError');

      // allow skip by leaving email empty
      if(email === ""){
        state.askedEmailOnce = true;
        setHash(routes.quiz);
        return;
      }

      if(!validateEmail(email)){
        err.style.display = "block";
        return;
      }

      err.style.display = "none";
      state.email = email;
      state.firstName = firstName;
      setHash(routes.quiz);
      return;
    }

    if(h === routes.result){
      if(!state.email){
        setHash(routes.email);
        return;
      }
      alert(`Plan envoyé à ${state.email} (démo).`);
      return;
    }
  });

  backBtn.addEventListener('click', () => {
    const h = getHash();

    if(h === routes.splash){
      return;
    }

    if(h === routes.home){
      setHash(routes.splash);
      return;
    }

    if(h === routes.quiz){
      if(state.qIndex > 0){
        state.qIndex -= 1;
        render();
      } else {
        setHash(routes.home);
      }
      return;
    }

    if(h === routes.email){
      setHash(routes.quiz);
      return;
    }

    if(h === routes.loading){
      // allow back to quiz, stop loading
      state.loadingStarted = false;
      setHash(routes.quiz);
      return;
    }

    if(h === routes.result){
      // back to last question
      state.qIndex = questions.length - 1;
      setHash(routes.quiz);
      return;
    }
  });

  window.addEventListener('hashchange', render);

  // init
  if(!window.location.hash) setHash(routes.splash);
  render();
</script>
</body>
</html>
